<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly campaign readout</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
      }
      body {
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        line-height: 1.5;
        /* Default: clip overflow. The frame below switches to scroll
           when the scaled-mode container query kicks in. */
        overflow: hidden;
      }

      /* ----- Scale frame -----
         Acts as the scroll container when the artifact renders at a fixed
         natural size and is scaled down. A container query lets the scaled
         mode kick in based on the parent's width, not the viewport. */
      .ppt-scale-frame {
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: inline-size;
      }

      /* ----- PowerPoint chrome (preserved from original) ----- */
      .ppt-app {
        background: #f3f2f1;
        overflow: hidden;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* Pinned to desktop size — chrome stays constant until the
           scaled-mode container query takes over. */
        font-size: 14px;
        transform-origin: top left;
      }

      /* ----- Scaled mode: <= 400px container width -----
         Pin a natural design footprint, scale it 80%, and let the frame
         scroll for anything that doesn't fit. */
      @container (max-width: 400px) {
        .ppt-scale-frame {
          overflow: hidden;
        }
        .ppt-app {
          /* width + height set by JS so visual fills the container at
             a fixed 0.9 scale; chrome layout adapts to the available
             width the same way it does above the breakpoint. */
          transform: scale(0.9);
        }
      }
      .ppt-titlebar {
        display: flex;
        align-items: center;
        padding: 0.7em 1em;
        background: #c43e1c;
        gap: 0.8em;
      }
      .ppt-titlebar-icon {
        width: 1.4em;
        height: 1.4em;
        background: white;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.8em;
        color: #c43e1c;
      }
      .ppt-titlebar-text {
        flex: 1;
        color: white;
        font-size: 0.9em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ppt-main {
        display: flex;
        background: #e1dfdd;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .ppt-slides-panel {
        /* Caps at 11em, but never wider than 20% of the app width. */
        width: min(11em, 20%);
        flex-shrink: 0;
        background: #f3f2f1;
        border-right: 1px solid #d2d0ce;
        padding: 0.8em;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        overflow-y: scroll;
        scrollbar-width: thin;
        scrollbar-color: #a19f9d transparent;
      }
      .ppt-slides-panel::-webkit-scrollbar { width: 4px; }
      .ppt-slides-panel::-webkit-scrollbar-track { background: transparent; }
      .ppt-slides-panel::-webkit-scrollbar-thumb { background: #a19f9d; border-radius: 2px; }
      .ppt-slides-panel::-webkit-scrollbar-thumb:hover { background: #8a8886; }

      .ppt-thumbnail {
        background: white;
        border: 0.15em solid transparent;
        border-radius: 0.2em;
        padding: 0.2em;
        cursor: pointer;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .ppt-thumbnail.active { border-color: #c43e1c; }
      .ppt-thumbnail:hover:not(.active) { border-color: #a4a4a4; }

      .ppt-viewport-area {
        flex: 1;
        padding: 1.5em;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        overflow: hidden;
      }
      .ppt-slide-frame {
        background: white;
        box-shadow: 0 0.15em 0.5em rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 100%;
      }

      /* ----- Slide canvas -----
         Every slide is rendered at a fixed 1280x720 design size.
         The wrapper (frame or thumbnail-inner) creates a 16:9 box and
         scales the slide via CSS transform to fit. Authors size content
         in px using this 1280x720 canvas — same units PowerPoint uses. */
      .ppt-thumbnail-inner,
      .ppt-slide-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }
      .ppt-thumbnail-inner { border-radius: 0.15em; }

      .ppt-slide {
        /* Fixed design canvas. Authors compose against this size. */
        width: 1280px;
        height: 720px;
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
        background: #ffffff;
        color: #1f1f1f;
        overflow: hidden;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }

      /* ----- Built-in slide layouts -----
         Pick one via data-layout="...". All sizes are px against the
         1280x720 canvas. Custom slides omit data-layout and add their
         own scoped CSS inside a <style> block in the <template>. */
      .ppt-slide[data-layout="title"] {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 110px 140px;
        background: linear-gradient(135deg, #c43e1c 0%, #8a2a12 100%);
        color: white;
      }
      .ppt-slide[data-layout="title"] h1 { font-size: 84px; font-weight: 600; line-height: 1.1; }
      .ppt-slide[data-layout="title"] p { font-size: 32px; margin-top: 24px; opacity: 0.9; }

      .ppt-slide[data-layout="bullets"] {
        padding: 80px 100px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .ppt-slide[data-layout="bullets"] h2 { font-size: 56px; color: #c43e1c; font-weight: 600; }
      .ppt-slide[data-layout="bullets"] ul { padding-left: 48px; display: flex; flex-direction: column; gap: 20px; }
      .ppt-slide[data-layout="bullets"] li { font-size: 32px; line-height: 1.4; }

      .ppt-slide[data-layout="two-column"] {
        padding: 80px 100px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 32px;
      }
      .ppt-slide[data-layout="two-column"] h2 { font-size: 56px; color: #c43e1c; font-weight: 600; }
      .ppt-slide[data-layout="two-column"] .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
      }
      .ppt-slide[data-layout="two-column"] .col h3 { font-size: 34px; font-weight: 600; margin-bottom: 16px; }
      .ppt-slide[data-layout="two-column"] .col p { font-size: 26px; line-height: 1.5; }

      .ppt-slide[data-layout="stat"] {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 80px;
        text-align: center;
        gap: 24px;
      }
      .ppt-slide[data-layout="stat"] .big-number { font-size: 240px; font-weight: 700; color: #c43e1c; line-height: 1; }
      .ppt-slide[data-layout="stat"] .caption { font-size: 38px; color: #605e5c; max-width: 900px; }

      .ppt-slide[data-layout="closing"] {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 100px;
        text-align: center;
        gap: 32px;
        background: #1f1f1f;
        color: white;
      }
      .ppt-slide[data-layout="closing"] h2 { font-size: 80px; font-weight: 600; }
      .ppt-slide[data-layout="closing"] p { font-size: 32px; opacity: 0.85; }

      /* ═══════════════════════════════════════════════════════════════
         SLATEBECK — deck system, prefix sb-
         Ported from lp-appifacts slides-artifacts/themed/kit.slatebeck.css
         (direction 06, slate-blue swatchbook variant) at 1cqw = 12.8px.
         Paper + hairline grid; Archivo 700 headings; every tag in brackets;
         accent #6b9bcb, deep #3e6e9e, navy #14293c, tint ramp t1→t3.
         Cover: blue ground, mono glyph field, white mega-pills.
         ═══════════════════════════════════════════════════════════════ */
      .ppt-slide[data-slide^="sb-"] {
        --sb-ink: #272320;
        --sb-ink2: #56504a;
        --sb-ink3: #8f887e;
        --sb-paper: #f7f5f1;
        --sb-grid: #eceae3;
        --sb-line: #e7e4dd;
        --sb-acc: #6b9bcb;
        --sb-deep: #3e6e9e;
        --sb-navy: #14293c;
        --sb-rule: #24549c;
        --sb-t1: #dce7f2;
        --sb-t2: #c2d5e8;
        --sb-t3: #9cbbd9;
        --sb-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
        --sb-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        font-family: var(--sb-sans);
        color: var(--sb-ink);
        background-color: var(--sb-paper);
        background-image: linear-gradient(to right, var(--sb-grid) 1px, transparent 1px),
                          linear-gradient(to bottom, var(--sb-grid) 1px, transparent 1px);
        background-size: 142.2px 142.2px;
      }
      .ppt-slide[data-slide^="sb-"] .br { opacity: 0.55; }

      /* ── cover: glyph field + white mega-pills ── */
      .ppt-slide[data-slide^="sb-"].sb-cover { background: var(--sb-acc); color: #fff; }
      .sb-glyphfield { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.8; }
      .sb-cover .s-pad { justify-content: center; align-items: center; text-align: center; z-index: 1; }
      .sb-cover .s-kicker { align-self: center; color: #fff; background: rgba(255,255,255,0.14);
        border-color: rgba(255,255,255,0.32); margin-bottom: 34px; }
      .sb-pillstack { display: flex; flex-direction: column; align-items: center; gap: 18px; margin: 0; }
      .sb-megapill { display: inline-block; background: #fff; border-radius: 999px; padding: 20px 69px 24px;
        box-shadow: 0 3px 0 rgba(20,41,60,0.10); color: var(--sb-navy); font-size: 78px; font-weight: 740;
        letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; }
      .sb-sub { font-size: 27px; line-height: 1.4; color: #fff; opacity: 0.88; font-weight: 500;
        margin-top: 31px; max-width: 1040px; }
      .sb-cover .s-foot { color: rgba(255,255,255,0.8); }
      .sb-cover .s-foot .brand { color: #fff; }

      /* ── interior slides: deck-kit grammar on the grid ── */
      .s-pad { position: absolute; inset: 0; padding: 82px 92px 108px; display: flex; flex-direction: column; }
      .s-kicker { font-family: var(--sb-mono); text-transform: uppercase; letter-spacing: 0.1em; font-size: 20px;
        font-weight: 500; line-height: 1.3; color: var(--sb-deep); background: #fff; border: 1px solid var(--sb-line);
        align-self: flex-start; padding: 7px 14px; border-radius: 3px; margin-bottom: 28px; }
      .s-h { font-size: 49px; line-height: 1.12; font-weight: 700; letter-spacing: -0.028em; margin: 0 0 31px; }
      .s-note { font-family: var(--sb-mono); font-style: normal; font-size: 17px; line-height: 1.5;
        letter-spacing: 0.02em; color: var(--sb-ink2); margin: 23px 0 0; }

      /* the ±10% flag — the skin's filled tag, top-right */
      .s-rflag { position: absolute; top: 72px; right: 92px; font-family: var(--sb-mono); font-size: 17px;
        font-weight: 500; line-height: 1.3; letter-spacing: 0.12em; text-transform: uppercase; color: #fff;
        background: var(--sb-deep); padding: 10px 14px 9px; border-radius: 3px; }
      /* flagged value in prose or a table cell: the .ent tint */
      .s-flag { background: var(--sb-t1); box-shadow: inset 0 -1px 0 var(--sb-t3); padding: 1px 6px;
        color: var(--sb-ink); font-weight: 600; white-space: nowrap; }

      /* list — solid accent square */
      .s-list { margin: 0; padding: 0; list-style: none; font-size: 26px; line-height: 1.45; color: var(--sb-ink2); }
      .s-list li { margin: 0 0 24px; padding-left: 34px; position: relative; }
      .s-list li:last-child { margin-bottom: 0; }
      .s-list li::before { content: ""; position: absolute; left: 0; top: 13px; width: 12px; height: 12px;
        border-radius: 1px; background: var(--sb-acc); }
      .s-list strong { color: var(--sb-ink); font-weight: 640; }
      .s-pad > * + .s-note { flex: none; }

      /* two-column body; the stat column carries the pixel matrix */
      .s-cols { display: flex; gap: 64px; flex: 1; min-height: 0; align-items: center; }
      .s-cols > div { flex: 1; min-width: 0; }
      .s-cols > .is-stat { flex: 0 0 34%; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
      .sb-pxmatrix { display: block; width: 294px; height: auto; }
      .sb-pxmatrix .p1 { fill: var(--sb-t1); } .sb-pxmatrix .p2 { fill: var(--sb-t2); }
      .sb-pxmatrix .p3 { fill: var(--sb-t3); } .sb-pxmatrix .p4 { fill: var(--sb-acc); }

      /* stat grid */
      .s-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 38px 64px; flex: 1; align-content: center; }
      .s-stats.row3 { grid-template-columns: 1fr 1fr 1fr; align-items: center; }
      .s-stat .lbl { font-size: 23px; font-weight: 500; color: var(--sb-ink3); }
      .s-stat .num { font-size: 82px; font-weight: 760; letter-spacing: -0.035em; line-height: 1.1;
        font-variant-numeric: tabular-nums; }
      .s-stat .num.s-flag { background: none; box-shadow: none; padding: 0; color: var(--sb-acc); }
      .s-stats.row3 .num { font-size: 67px; }
      /* the 2×2 grid carries four wrapped deltas + a two-line footnote: tighter than the kit's 6.4cqw */
      .s-stats:not(.row3) { gap: 26px 64px; }
      .s-stats:not(.row3) .num { font-size: 68px; }
      .s-stat .lbl, .s-stat .delta { line-height: 1.25; }
      .s-stats:not(.row3) .lbl, .s-stats:not(.row3) .delta { font-size: 21px; }
      .s-stats + .s-note { margin-top: 16px; }
      .s-stat .delta { font-size: 23px; color: var(--sb-ink3); margin-top: 5px; }
      .s-stat .delta b { color: var(--sb-deep); font-weight: 600; }

      /* table — navy header rule, mono tabular numbers, tint on the flagged row */
      .s-table { width: 100%; border-collapse: collapse; font-size: 24px; line-height: 1.35; }
      .s-table th { font-family: var(--sb-mono); font-weight: 500; font-size: 18px; text-transform: uppercase;
        letter-spacing: 0.1em; color: var(--sb-deep); text-align: left; padding: 11px 18px;
        border-bottom: 1.5px solid var(--sb-rule); }
      .s-table td { padding: 17px 18px; border-bottom: 1px solid var(--sb-line); color: var(--sb-ink2); vertical-align: top; }
      .s-table td:first-child { color: var(--sb-ink); font-weight: 640; }
      .s-table td.n { font-family: var(--sb-mono); font-variant-numeric: tabular-nums; font-size: 22px;
        color: var(--sb-ink); white-space: nowrap; }
      .s-table tr.flagged td { background: #e9f1f8; }

      /* date stack — bracket-tag dates on a navy spine with square markers */
      .s-dstack { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0; }
      .s-dstep { display: flex; align-items: baseline; position: relative; padding: 12px 0; }
      .s-dstep::before { content: ""; position: absolute; left: 192px; top: 0; bottom: 0; width: 1px;
        background: var(--sb-rule); opacity: 0.35; }
      .s-dstep:first-child::before { top: 20px; }
      .s-dstep:last-child::before { bottom: 20px; }
      .s-dstep .when { flex: 0 0 192px; font-family: var(--sb-mono); font-size: 18.5px; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--sb-deep); font-weight: 500; white-space: nowrap; }
      .s-dstep .what { flex: 1; position: relative; padding-left: 38px; font-size: 25px; line-height: 1.4;
        color: var(--sb-ink2); }
      .s-dstep .what::before { content: ""; position: absolute; left: -6px; top: 12px; width: 12px; height: 12px;
        background: var(--sb-acc); border-radius: 1px; }
      .s-dstep .what strong { color: var(--sb-ink); font-weight: 640; }

      /* footer — mono wordmark + bracket folio */
      .s-foot { position: absolute; left: 92px; right: 92px; bottom: 33px; display: flex; align-items: center;
        justify-content: space-between; font-family: var(--sb-mono); font-size: 19px; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--sb-ink3); }
      .s-foot .brand { font-weight: 600; color: var(--sb-ink2); letter-spacing: 0.015em; }

      .ppt-bottombar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4em;
        background: #f3f2f1;
        border-top: 1px solid #d2d0ce;
        font-size: 0.8em;
        color: #605e5c;
      }
      .ppt-nav-btn {
        width: 1.8em;
        height: 1.8em;
        border: 1px solid #d2d0ce;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #323130;
        transition: all 0.1s ease;
      }
      .ppt-nav-btn:hover:not(:disabled) { background: #f3f2f1; border-color: #8a8886; }
      .ppt-nav-btn:disabled { opacity: 0.4; cursor: default; }
      .ppt-nav-btn svg { width: 1em; height: 1em; }
      .ppt-slide-counter { font-size: 0.85em; color: #323130; flex: 1; text-align: center; }

      @media (max-width: 480px) {
        .ppt-viewport-area { padding: 1em; }
      }
    

      /* ----- Card zoom (Skylar 2026-09-03: "content of excel sheet
         too small to read", extended to every facsimile family) -----
         Card surfaces pin this document to its authoring box and
         transform-scale the whole iframe into a far smaller window — the
         library rails at ~0.44, the modal artifact well at 0.6, the card
         face at 0.61 — so this chrome's em-derived text was landing at
         4-6px. Authoring the document zoomed puts the surface's shrink on
         legible type instead. Here the slide is a fixed composition, so its stage is pinned below rather than left to shrink.
         Gated on the LAYOUT width so the roles band's ~608px artifact
         mount and the phone embed page stay 1x. */
      @media (min-width: 1000px) {
        .ppt-app {
          font-size: calc(14px * 1.6);
        }
        /* The slide must not pay for the chrome. Every one of these is em-based
           and would grow with the base size above — the rail and the stage
           padding stealing width, the two bars stealing height — and the slide
           is height-capped by its 16:9 frame, so it would come out SMALLER than
           before the zoom. Pinned to px (and trimmed a little) so the chrome
           text grows and the slide gains room instead of losing it. */
        .ppt-slides-panel {
          width: 154px;
          padding: 8px;
        }
        .ppt-viewport-area {
          padding: 10px;
        }
        .ppt-titlebar {
          padding: 7px 14px;
        }
        .ppt-bottombar {
          padding: 5px;
        }
      }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="sb-glyphs" width="56" height="32" patternUnits="userSpaceOnUse">
      <text x="4" y="10" font-size="9" font-family="monospace" fill="#a9c9e6" opacity="0.75">+·</text>
      <text x="30" y="12" font-size="9" font-family="monospace" fill="#a9c9e6" opacity="0.6">01</text>
      <text x="10" y="26" font-size="9" font-family="monospace" fill="#a9c9e6" opacity="0.65">//</text>
      <text x="38" y="28" font-size="9" font-family="monospace" fill="#a9c9e6" opacity="0.7">·+</text>
    </pattern>
  </defs>
</svg>
<div class="ppt-scale-frame">
    <div class="ppt-app" id="ppt-viewer">
      <div class="ppt-titlebar">
        <div class="ppt-titlebar-icon">P</div>
        <span class="ppt-titlebar-text">Presentation.pptx - PowerPoint</span>
      </div>

      <div class="ppt-main">
        <div class="ppt-slides-panel"></div>
        <div class="ppt-viewport-area">
          <div class="ppt-slide-frame"></div>
        </div>
      </div>

      <div class="ppt-bottombar">
        <button class="ppt-nav-btn prev" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <span class="ppt-slide-counter">1 of 1</span>
        <button class="ppt-nav-btn next" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
        </button>
      </div>
    </div>

    <template id="ppt-slides">
      <div class="ppt-slide sb-cover" data-slide="sb-wr-title" data-title="Weekly campaign readout — Week of Aug 17">
        <svg class="sb-glyphfield" aria-hidden="true"><rect width="100%" height="100%" fill="url(#sb-glyphs)"/></svg>
        <div class="s-pad">
          <div class="s-kicker"><span class="br">[ </span>Weekly campaign readout · Pulled Mon Aug 24, 7:41 AM<span class="br"> ]</span></div>
          <div class="sb-pillstack"><span class="sb-megapill">Campaign readout</span><span class="sb-megapill">Week of Aug 17</span></div>
          <div class="sb-sub">Four numbers moved more than ten percent — each one gets its own why · Amplitude for web views and sign-ups, BigQuery for ads, email, and social · vs Aug 10–16</div>
        </div>
        <div class="s-foot"><span class="brand">Larkmere Parks Conservancy</span><span><span class="br">[ </span>1 / 7<span class="br"> ]</span></span></div>
      </div>

      <div class="ppt-slide" data-slide="sb-wr-summary">
        <div class="s-pad">

    <script>
      const DESIGN_WIDTH = 1280;

      class PowerPointViewer {
        constructor(container, config = {}) {
          this.container = typeof container === "string" ? document.querySelector(container) : container;
          this.maxSlides = 7;
          this.title = config.title || "Presentation";
          this.currentIndex = 0;

          const source = document.querySelector(config.slidesTemplate || "#ppt-slides");
          const all = source ? Array.from(source.content.querySelectorAll(".ppt-slide")) : [];
          if (all.length > this.maxSlides) {
            console.warn(`[PowerPointViewer] ${all.length} slides provided; capping to ${this.maxSlides}.`);
          }
          this.slides = all.slice(0, this.maxSlides);

          this.viewportFrame = this.container.querySelector(".ppt-slide-frame");
          this.thumbnailsPanel = this.container.querySelector(".ppt-slides-panel");
          this.counter = this.container.querySelector(".ppt-slide-counter");
          this.prevBtn = this.container.querySelector(".ppt-nav-btn.prev");
          this.nextBtn = this.container.querySelector(".ppt-nav-btn.next");
          this.titleBar = this.container.querySelector(".ppt-titlebar-text");
          this.scaleFrame = this.container.parentElement; // .ppt-scale-frame

          this.SCALED_BREAKPOINT = 400;
          this.SCALED_FACTOR = 0.9;

          this.init();
        }

        init() {
          if (this.titleBar) this.titleBar.textContent = `${this.title}.pptx - PowerPoint`;
          document.title = this.title;
          this.renderThumbnails();
          this.bindEvents();
          this.showSlide(0);
          this.updateScale();
          this.rescaleAll();
          // Rescale on resize — viewport AND every thumbnail.
          new ResizeObserver(() => {
            this.updateScale();
            this.rescaleAll();
          }).observe(this.container);
          if (this.scaleFrame) {
            new ResizeObserver(() => {
              this.updateScale();
              this.rescaleAll();
            }).observe(this.scaleFrame);
          }
        }

        /** Below the breakpoint, hold a fixed 0.9 scale and set the
            ppt-app's pre-scale width/height to containerSize / 0.9 so the
            visual fills the container exactly. The internal layout
            (chrome + slide canvas) stays responsive at all sizes. */
        updateScale() {
          if (!this.scaleFrame) return;
          const w = this.scaleFrame.clientWidth;
          const h = this.scaleFrame.clientHeight;
          if (w <= this.SCALED_BREAKPOINT) {
            this.container.style.width = (w / this.SCALED_FACTOR) + "px";
            this.container.style.height = (h / this.SCALED_FACTOR) + "px";
          } else {
            this.container.style.width = "";
            this.container.style.height = "";
          }
        }

        /** Wrap a slide clone in a sized container and scale it to fit. */
        mountSlide(slide, wrapper) {
          wrapper.innerHTML = "";
          const clone = slide.cloneNode(true);
          wrapper.appendChild(clone);
          this.scaleSlide(wrapper);
        }

        scaleSlide(wrapper) {
          const slide = wrapper.querySelector(".ppt-slide");
          if (!slide) return;
          // Use offsetWidth (layout width), NOT getBoundingClientRect().width.
          // In scaled mode the .ppt-app carries transform: scale(0.9), and
          // getBoundingClientRect would report the post-transform size — which
          // would compound with the slide's own scale and leave the slide
          // under-filling the frame (white gap bottom-right). offsetWidth
          // ignores ancestor transforms, so the slide fills the frame's layout
          // box and the ancestor scale is applied once, to both, together.
          const width = wrapper.offsetWidth;
          if (width > 0) {
            slide.style.transform = `scale(${width / DESIGN_WIDTH})`;
          }
        }

        rescaleAll() {
          this.scaleSlide(this.viewportFrame);
          this.thumbnailsPanel?.querySelectorAll(".ppt-thumbnail-inner").forEach((w) => this.scaleSlide(w));
        }

        renderThumbnails() {
          if (!this.thumbnailsPanel) return;
          this.thumbnailsPanel.innerHTML = "";
          this.slides.forEach((slide, i) => {
            const thumb = document.createElement("div");
            thumb.className = "ppt-thumbnail" + (i === 0 ? " active" : "");
            thumb.dataset.index = String(i);
            const inner = document.createElement("div");
            inner.className = "ppt-thumbnail-inner";
            thumb.appendChild(inner);
            this.thumbnailsPanel.appendChild(thumb);
            this.mountSlide(slide, inner);
          });
        }

        showSlide(index) {
          if (this.slides.length === 0) return;
          this.currentIndex = Math.max(0, Math.min(index, this.slides.length - 1));
          this.mountSlide(this.slides[this.currentIndex], this.viewportFrame);
          this.counter.textContent = `${this.currentIndex + 1} of ${this.slides.length}`;
          this.prevBtn.disabled = this.currentIndex === 0;
          this.nextBtn.disabled = this.currentIndex === this.slides.length - 1;
          this.thumbnailsPanel?.querySelectorAll(".ppt-thumbnail").forEach((t, i) => {
            t.classList.toggle("active", i === this.currentIndex);
          });
        }

        prev() { this.showSlide(this.currentIndex - 1); }
        next() { this.showSlide(this.currentIndex + 1); }

        bindEvents() {
          this.prevBtn?.addEventListener("click", () => this.prev());
          this.nextBtn?.addEventListener("click", () => this.next());
          this.thumbnailsPanel?.addEventListener("click", (e) => {
            const thumb = e.target.closest(".ppt-thumbnail");
            if (thumb) this.showSlide(parseInt(thumb.dataset.index, 10));
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") this.prev();
            if (e.key === "ArrowRight") this.next();
          });

          let startX = 0;
          this.container.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
          this.container.addEventListener("touchend", (e) => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) diff > 0 ? this.next() : this.prev();
          }, { passive: true });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const firstTitle = document
          .querySelector("#ppt-slides")
          ?.content?.querySelector(".ppt-slide")
          ?.dataset?.title;
        new PowerPointViewer("#ppt-viewer", {
          title: firstTitle || "Presentation",
          slidesTemplate: "#ppt-slides",
        });
      });
    </script>
