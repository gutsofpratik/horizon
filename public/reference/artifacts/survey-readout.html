<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement survey H1 2026 — exec readout</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
      }
      body {
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        line-height: 1.5;
        /* Default: clip overflow. The frame below switches to scroll
           when the scaled-mode container query kicks in. */
        overflow: hidden;
      }

      /* ----- Scale frame -----
         Acts as the scroll container when the artifact renders at a fixed
         natural size and is scaled down. A container query lets the scaled
         mode kick in based on the parent's width, not the viewport. */
      .ppt-scale-frame {
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: inline-size;
      }

      /* ----- PowerPoint chrome (preserved from original) ----- */
      .ppt-app {
        background: #f3f2f1;
        overflow: hidden;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* Pinned to desktop size — chrome stays constant until the
           scaled-mode container query takes over. */
        font-size: 14px;
        transform-origin: top left;
      }

      /* ----- Scaled mode: <= 400px container width -----
         Pin a natural design footprint, scale it 80%, and let the frame
         scroll for anything that doesn't fit. */
      @container (max-width: 400px) {
        .ppt-scale-frame {
          overflow: hidden;
        }
        .ppt-app {
          /* width + height set by JS so visual fills the container at
             a fixed 0.9 scale; chrome layout adapts to the available
             width the same way it does above the breakpoint. */
          transform: scale(0.9);
        }
      }
      .ppt-titlebar {
        display: flex;
        align-items: center;
        padding: 0.7em 1em;
        background: #c43e1c;
        gap: 0.8em;
      }
      .ppt-titlebar-icon {
        width: 1.4em;
        height: 1.4em;
        background: white;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.8em;
        color: #c43e1c;
      }
      .ppt-titlebar-text {
        flex: 1;
        color: white;
        font-size: 0.9em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ppt-main {
        display: flex;
        background: #e1dfdd;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .ppt-slides-panel {
        /* Caps at 11em, but never wider than 20% of the app width. */
        width: min(11em, 20%);
        flex-shrink: 0;
        background: #f3f2f1;
        border-right: 1px solid #d2d0ce;
        padding: 0.8em;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        overflow-y: scroll;
        scrollbar-width: thin;
        scrollbar-color: #a19f9d transparent;
      }
      .ppt-slides-panel::-webkit-scrollbar { width: 4px; }
      .ppt-slides-panel::-webkit-scrollbar-track { background: transparent; }
      .ppt-slides-panel::-webkit-scrollbar-thumb { background: #a19f9d; border-radius: 2px; }
      .ppt-slides-panel::-webkit-scrollbar-thumb:hover { background: #8a8886; }

      .ppt-thumbnail {
        background: white;
        border: 0.15em solid transparent;
        border-radius: 0.2em;
        padding: 0.2em;
        cursor: pointer;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .ppt-thumbnail.active { border-color: #c43e1c; }
      .ppt-thumbnail:hover:not(.active) { border-color: #a4a4a4; }

      .ppt-viewport-area {
        flex: 1;
        padding: 1.5em;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        overflow: hidden;
      }
      .ppt-slide-frame {
        background: white;
        box-shadow: 0 0.15em 0.5em rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 100%;
      }

      /* ----- Slide canvas -----
         Every slide is rendered at a fixed 1280x720 design size.
         The wrapper (frame or thumbnail-inner) creates a 16:9 box and
         scales the slide via CSS transform to fit. Authors size content
         in px using this 1280x720 canvas — same units PowerPoint uses. */
      .ppt-thumbnail-inner,
      .ppt-slide-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }
      .ppt-thumbnail-inner { border-radius: 0.15em; }

      .ppt-slide {
        /* Fixed design canvas. Authors compose against this size. */
        width: 1280px;
        height: 720px;
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
        background: #ffffff;
        color: #1f1f1f;
        overflow: hidden;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }

      /* ----- Built-in slide layouts -----
         Pick one via data-layout="...". All sizes are px against the
         1280x720 canvas. Custom slides omit data-layout and add their
         own scoped CSS inside a <style> block in the <template>. */
      .ppt-slide[data-layout="title"] {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 110px 140px;
        background: linear-gradient(135deg, #c43e1c 0%, #8a2a12 100%);
        color: white;
      }
      .ppt-slide[data-layout="title"] h1 { font-size: 84px; font-weight: 600; line-height: 1.1; }
      .ppt-slide[data-layout="title"] p { font-size: 32px; margin-top: 24px; opacity: 0.9; }

      .ppt-slide[data-layout="bullets"] {
        padding: 80px 100px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .ppt-slide[data-layout="bullets"] h2 { font-size: 56px; color: #c43e1c; font-weight: 600; }
      .ppt-slide[data-layout="bullets"] ul { padding-left: 48px; display: flex; flex-direction: column; gap: 20px; }
      .ppt-slide[data-layout="bullets"] li { font-size: 32px; line-height: 1.4; }

      .ppt-slide[data-layout="two-column"] {
        padding: 80px 100px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 32px;
      }
      .ppt-slide[data-layout="two-column"] h2 { font-size: 56px; color: #c43e1c; font-weight: 600; }
      .ppt-slide[data-layout="two-column"] .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
      }
      .ppt-slide[data-layout="two-column"] .col h3 { font-size: 34px; font-weight: 600; margin-bottom: 16px; }
      .ppt-slide[data-layout="two-column"] .col p { font-size: 26px; line-height: 1.5; }

      .ppt-slide[data-layout="stat"] {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 80px;
        text-align: center;
        gap: 24px;
      }
      .ppt-slide[data-layout="stat"] .big-number { font-size: 240px; font-weight: 700; color: #c43e1c; line-height: 1; }
      .ppt-slide[data-layout="stat"] .caption { font-size: 38px; color: #605e5c; max-width: 900px; }

      .ppt-slide[data-layout="closing"] {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 100px;
        text-align: center;
        gap: 32px;
        background: #1f1f1f;
        color: white;
      }
      .ppt-slide[data-layout="closing"] h2 { font-size: 80px; font-weight: 600; }
      .ppt-slide[data-layout="closing"] p { font-size: 32px; opacity: 0.85; }

      /* ═══════════════════════════════════════════════════════════════
         KESTREL · bright blue agent — deck system, prefix k-
         Pulled from lp-appifacts kit.kestrel.css at 1cqw = 12.8px. Flat
         #2b4bf2 cover with the ellipse field and one oversized cursor;
         Manrope 800 + IBM Plex Mono; rounded #edf1fe cards with the
         dotted orb; wordmark-plus-orb footer. All sizes px on 1280x720.
         ═══════════════════════════════════════════════════════════════ */
      .ppt-slide[data-slide^="k-"] {
        --k-ink: #101b34; --k-ink2: #3b4763; --k-ink3: #75819c;
        --k-paper: #ffffff; --k-blue: #2b4bf2; --k-tint: #edf1fe; --k-line: #e2e7f5;
        --k-sand: rgba(255, 255, 255, 0.66);
        --k-pos: #159a5b; --k-neg: #d8503a;
        --k-flag: #8a5a17; --k-flag-bg: #f6edda; --k-flag-line: #e3d2ac;
        --k-sans: "Manrope", "Avenir Next", "Helvetica Neue", sans-serif;
        --k-mono: "IBM Plex Mono", "Menlo", ui-monospace, monospace;
        font-family: var(--k-sans);
        color: var(--k-ink);
        background: var(--k-paper);
      }
      .ppt-slide[data-slide^="k-"].k-cover { background: var(--k-blue); color: #fff; }

      /* ── cover: ellipse field, centred copy, one oversized cursor ── */
      .k-ellipses { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; }
      .k-ellipses ellipse { fill: none; stroke: #fff; stroke-opacity: 0.36; stroke-width: 3; }
      .k-cover .s-pad { align-items: center; justify-content: center; text-align: center; z-index: 1; }
      .k-cover .s-kicker { color: var(--k-sand); }
      .k-title { font-size: 77px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; margin: 0;
        max-width: 1024px; }
      .k-sub { font-size: 29px; line-height: 1.3; color: rgba(255, 255, 255, 0.78); margin-top: 31px; }
      .k-bigcursor { position: absolute; z-index: 2; width: 128px; height: 128px; left: 731px; top: 485px; overflow: visible; }
      .k-bigcursor path { fill: #fff; stroke: var(--k-ink); }
      .k-minicursor { position: absolute; z-index: 1; width: 35px; height: 35px; overflow: visible;
        filter: drop-shadow(0 2px 6px rgba(16, 27, 52, 0.28)); }
      .k-minicursor path { fill: var(--k-ink); stroke: #fff; }

      /* ── interior slides: deck-kit grammar ── */
      .s-pad { position: absolute; inset: 0; padding: 82px 92px 108px; display: flex; flex-direction: column; }
      .s-kicker { font-family: var(--k-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 20px;
        font-weight: 500; color: var(--k-blue); margin-bottom: 28px; }
      .s-h { font-size: 47px; line-height: 1.12; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 33px; }
      .s-note { font-size: 22px; line-height: 1.4; color: var(--k-ink3); font-style: italic; margin: 0; }
      .s-note .attr { font-family: var(--k-mono); font-style: normal; font-size: 13px; letter-spacing: 0.1em;
        text-transform: uppercase; margin-left: 14px; }
      .s-pad > * + .s-note { flex: none; margin-top: 20px; }
      .s-flag { color: var(--k-pos); font-weight: 600; }
      .s-flag.is-neg { color: var(--k-neg); }

      /* flag chip — the kit's amber pill */
      .s-rflag { position: absolute; top: 72px; right: 92px; display: inline-flex; align-items: center; gap: 11px;
        font-family: var(--k-mono); font-size: 17px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase;
        color: var(--k-flag); background: var(--k-flag-bg); border: 1px solid var(--k-flag-line);
        padding: 9px 17px; border-radius: 100px; }
      .s-rflag::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--k-flag); flex: none; }

      /* the dotted orb */
      .k-orb { display: block; width: 41px; height: 41px; flex: none; color: var(--k-blue); }
      .k-orb.sm { width: 31px; height: 31px; }
      .k-orb.is-neg { color: var(--k-neg); }
      .k-orb.is-dim { color: var(--k-ink3); }

      /* stats on rounded tint cards — four across */
      .k-stats { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px;
        align-content: center; align-items: stretch; }
      .k-stat { background: var(--k-tint); border-radius: 24px; padding: 28px 28px 30px; display: flex; flex-direction: column; }
      .k-stat .k-orb { margin-bottom: 24px; }
      .k-stat .num { font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; color: var(--k-blue); }
      .k-stat .lbl { font-size: 21px; line-height: 1.3; font-weight: 600; color: var(--k-ink3); margin-top: 13px; }
      .k-stat .delta { font-size: 20px; line-height: 1.35; color: var(--k-ink3); margin-top: 7px; }
      .k-stat .delta b { color: var(--k-ink); font-weight: 700; }

      /* parked-list card — the department rows */
      .k-lcard { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
      .k-lcard .card { background: var(--k-tint); border-radius: 24px; padding: 6px 32px; }
      .k-lrow { display: grid; grid-template-columns: 31px 1fr 110px 190px 1.1fr; align-items: center; gap: 20px;
        padding: 17px 0; border-top: 1px solid rgba(16, 27, 52, 0.08); font-size: 24px; line-height: 1.3; color: var(--k-ink2); }
      .k-lrow:first-child { border-top: 0; }
      .k-lrow .name { color: var(--k-ink); font-weight: 700; }
      .k-lrow .score { font-weight: 700; color: var(--k-ink); font-variant-numeric: tabular-nums; }
      .k-lrow .delta { font-weight: 600; color: var(--k-pos); }
      .k-lrow .delta.is-neg { color: var(--k-neg); }
      .k-lrow .delta.is-dim { color: var(--k-ink3); font-weight: 500; }
      .k-lrow .resp { color: var(--k-ink3); font-size: 21px; }

      /* agent cards + one big blue number */
      .k-cols { display: flex; gap: 64px; flex: 1; min-height: 0; align-items: center; }
      .k-acards { flex: 1.55; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; position: relative; }
      .k-acard { background: var(--k-tint); border-radius: 24px; padding: 20px 28px; display: flex; align-items: flex-start; gap: 18px; min-width: 0; }
      .k-acard .k-orb { margin-top: 2px; }
      .k-acard > div { min-width: 0; }
      .k-acard .t { font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.012em; color: var(--k-ink); }
      .k-acard .b { font-size: 20px; line-height: 1.4; color: var(--k-ink2); margin-top: 5px; }
      .k-acard.hover { background: #fff; box-shadow: 0 1px 2px rgba(16, 27, 52, 0.05), 0 10px 26px rgba(16, 27, 52, 0.13); }
      .k-big { flex: 1; align-self: center; }
      .k-big .num { font-size: 128px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; color: var(--k-blue); }
      .k-big .lbl { font-size: 21px; line-height: 1.3; font-weight: 600; color: var(--k-ink3); margin-top: 13px; max-width: 333px; }

      /* decisions — two cards, then the parked row */
      .k-agrid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
      .k-agrid .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      .k-agrid .k-acard { padding: 24px 29px; }
      .k-agrid .k-acard .b { font-size: 20px; }
      .k-parked { background: var(--k-tint); border-radius: 24px; padding: 20px 29px; display: flex; align-items: flex-start; gap: 18px;
        font-size: 21px; line-height: 1.4; color: var(--k-ink2); }
      .k-parked strong { color: var(--k-ink); font-weight: 700; }
      .k-parked .k-orb { margin-top: 1px; }

      /* footer — wordmark with the orb ring + folio */
      .s-foot { position: absolute; left: 92px; right: 92px; bottom: 33px; display: flex; align-items: center;
        justify-content: space-between; font-size: 19px; color: var(--k-ink3); }
      .s-foot .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 600; letter-spacing: 0.015em; color: var(--k-ink2); }
      .s-foot .brand::before { content: ""; width: 15px; height: 15px; border-radius: 50%; border: 4.6px solid var(--k-blue); flex: none; box-sizing: border-box; }
      .k-cover .s-foot { color: rgba(255, 255, 255, 0.85); }
      .k-cover .s-foot .brand { color: rgba(255, 255, 255, 0.92); }
      .k-cover .s-foot .brand::before { border-color: rgba(255, 255, 255, 0.8); }

      .ppt-bottombar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4em;
        background: #f3f2f1;
        border-top: 1px solid #d2d0ce;
        font-size: 0.8em;
        color: #605e5c;
      }
      .ppt-nav-btn {
        width: 1.8em;
        height: 1.8em;
        border: 1px solid #d2d0ce;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #323130;
        transition: all 0.1s ease;
      }
      .ppt-nav-btn:hover:not(:disabled) { background: #f3f2f1; border-color: #8a8886; }
      .ppt-nav-btn:disabled { opacity: 0.4; cursor: default; }
      .ppt-nav-btn svg { width: 1em; height: 1em; }
      .ppt-slide-counter { font-size: 0.85em; color: #323130; flex: 1; text-align: center; }

      @media (max-width: 480px) {
        .ppt-viewport-area { padding: 1em; }
      }
    

      /* ----- Card zoom (Skylar 2026-09-03: "content of excel sheet
         too small to read", extended to every facsimile family) -----
         Card surfaces pin this document to its authoring box and
         transform-scale the whole iframe into a far smaller window — the
         library rails at ~0.44, the modal artifact well at 0.6, the card
         face at 0.61 — so this chrome's em-derived text was landing at
         4-6px. Authoring the document zoomed puts the surface's shrink on
         legible type instead. Here the slide is a fixed composition, so its stage is pinned below rather than left to shrink.
         Gated on the LAYOUT width so the roles band's ~608px artifact
         mount and the phone embed page stay 1x. */
      @media (min-width: 1000px) {
        .ppt-app {
          font-size: calc(14px * 1.6);
        }
        /* The slide must not pay for the chrome. Every one of these is em-based
           and would grow with the base size above — the rail and the stage
           padding stealing width, the two bars stealing height — and the slide
           is height-capped by its 16:9 frame, so it would come out SMALLER than
           before the zoom. Pinned to px (and trimmed a little) so the chrome
           text grows and the slide gains room instead of losing it. */
        .ppt-slides-panel {
          width: 154px;
          padding: 8px;
        }
        .ppt-viewport-area {
          padding: 10px;
        }
        .ppt-titlebar {
          padding: 7px 14px;
        }
        .ppt-bottombar {
          padding: 5px;
        }
      }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="k-orb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/><g fill="#fff"><circle cx="8.8" cy="5.6" r="0.95"/><circle cx="12" cy="5.6" r="0.95"/><circle cx="15.2" cy="5.6" r="0.95"/><circle cx="5.6" cy="8.8" r="0.95"/><circle cx="8.8" cy="8.8" r="0.95"/><circle cx="12" cy="8.8" r="0.95"/><circle cx="15.2" cy="8.8" r="0.95"/><circle cx="18.4" cy="8.8" r="0.95"/><circle cx="5.6" cy="12" r="0.95"/><circle cx="8.8" cy="12" r="0.95"/><circle cx="12" cy="12" r="0.95"/><circle cx="15.2" cy="12" r="0.95"/><circle cx="18.4" cy="12" r="0.95"/><circle cx="5.6" cy="15.2" r="0.95"/><circle cx="8.8" cy="15.2" r="0.95"/><circle cx="12" cy="15.2" r="0.95"/><circle cx="15.2" cy="15.2" r="0.95"/><circle cx="18.4" cy="15.2" r="0.95"/><circle cx="8.8" cy="18.4" r="0.95"/><circle cx="12" cy="18.4" r="0.95"/><circle cx="15.2" cy="18.4" r="0.95"/></g></symbol><symbol id="k-orb-parked" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8.2 12h7.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol></defs></svg>
<div class="ppt-scale-frame">
    <div class="ppt-app" id="ppt-viewer">
      <div class="ppt-titlebar">
        <div class="ppt-titlebar-icon">P</div>
        <span class="ppt-titlebar-text">Presentation.pptx - PowerPoint</span>
      </div>

      <div class="ppt-main">
        <div class="ppt-slides-panel"></div>
        <div class="ppt-viewport-area">
          <div class="ppt-slide-frame"></div>
        </div>
      </div>

      <div class="ppt-bottombar">
        <button class="ppt-nav-btn prev" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <span class="ppt-slide-counter">1 of 1</span>
        <button class="ppt-nav-btn next" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
        </button>
      </div>
    </div>

    <template id="ppt-slides">
      <div class="ppt-slide k-cover" data-slide="k-srv-title" data-title="Engagement survey H1 2026 — exec readout">

    <script>
      const DESIGN_WIDTH = 1280;

      class PowerPointViewer {
        constructor(container, config = {}) {
          this.container = typeof container === "string" ? document.querySelector(container) : container;
          this.maxSlides = 5;
          this.title = config.title || "Presentation";
          this.currentIndex = 0;

          const source = document.querySelector(config.slidesTemplate || "#ppt-slides");
          const all = source ? Array.from(source.content.querySelectorAll(".ppt-slide")) : [];
          if (all.length > this.maxSlides) {
            console.warn(`[PowerPointViewer] ${all.length} slides provided; capping to ${this.maxSlides}.`);
          }
          this.slides = all.slice(0, this.maxSlides);

          this.viewportFrame = this.container.querySelector(".ppt-slide-frame");
          this.thumbnailsPanel = this.container.querySelector(".ppt-slides-panel");
          this.counter = this.container.querySelector(".ppt-slide-counter");
          this.prevBtn = this.container.querySelector(".ppt-nav-btn.prev");
          this.nextBtn = this.container.querySelector(".ppt-nav-btn.next");
          this.titleBar = this.container.querySelector(".ppt-titlebar-text");
          this.scaleFrame = this.container.parentElement; // .ppt-scale-frame

          this.SCALED_BREAKPOINT = 400;
          this.SCALED_FACTOR = 0.9;

          this.init();
        }

        init() {
          if (this.titleBar) this.titleBar.textContent = `${this.title}.pptx - PowerPoint`;
          document.title = this.title;
          this.renderThumbnails();
          this.bindEvents();
          this.showSlide(0);
          this.updateScale();
          this.rescaleAll();
          // Rescale on resize — viewport AND every thumbnail.
          new ResizeObserver(() => {
            this.updateScale();
            this.rescaleAll();
          }).observe(this.container);
          if (this.scaleFrame) {
            new ResizeObserver(() => {
              this.updateScale();
              this.rescaleAll();
            }).observe(this.scaleFrame);
          }
        }

        /** Below the breakpoint, hold a fixed 0.9 scale and set the
            ppt-app's pre-scale width/height to containerSize / 0.9 so the
            visual fills the container exactly. The internal layout
            (chrome + slide canvas) stays responsive at all sizes. */
        updateScale() {
          if (!this.scaleFrame) return;
          const w = this.scaleFrame.clientWidth;
          const h = this.scaleFrame.clientHeight;
          if (w <= this.SCALED_BREAKPOINT) {
            this.container.style.width = (w / this.SCALED_FACTOR) + "px";
            this.container.style.height = (h / this.SCALED_FACTOR) + "px";
          } else {
            this.container.style.width = "";
            this.container.style.height = "";
          }
        }

        /** Wrap a slide clone in a sized container and scale it to fit. */
        mountSlide(slide, wrapper) {
          wrapper.innerHTML = "";
          const clone = slide.cloneNode(true);
          wrapper.appendChild(clone);
          this.scaleSlide(wrapper);
        }

        scaleSlide(wrapper) {
          const slide = wrapper.querySelector(".ppt-slide");
          if (!slide) return;
          // Use offsetWidth (layout width), NOT getBoundingClientRect().width.
          // In scaled mode the .ppt-app carries transform: scale(0.9), and
          // getBoundingClientRect would report the post-transform size — which
          // would compound with the slide's own scale and leave the slide
          // under-filling the frame (white gap bottom-right). offsetWidth
          // ignores ancestor transforms, so the slide fills the frame's layout
          // box and the ancestor scale is applied once, to both, together.
          const width = wrapper.offsetWidth;
          if (width > 0) {
            slide.style.transform = `scale(${width / DESIGN_WIDTH})`;
          }
        }

        rescaleAll() {
          this.scaleSlide(this.viewportFrame);
          this.thumbnailsPanel?.querySelectorAll(".ppt-thumbnail-inner").forEach((w) => this.scaleSlide(w));
        }

        renderThumbnails() {
          if (!this.thumbnailsPanel) return;
          this.thumbnailsPanel.innerHTML = "";
          this.slides.forEach((slide, i) => {
            const thumb = document.createElement("div");
            thumb.className = "ppt-thumbnail" + (i === 0 ? " active" : "");
            thumb.dataset.index = String(i);
            const inner = document.createElement("div");
            inner.className = "ppt-thumbnail-inner";
            thumb.appendChild(inner);
            this.thumbnailsPanel.appendChild(thumb);
            this.mountSlide(slide, inner);
          });
        }

        showSlide(index) {
          if (this.slides.length === 0) return;
          this.currentIndex = Math.max(0, Math.min(index, this.slides.length - 1));
          this.mountSlide(this.slides[this.currentIndex], this.viewportFrame);
          this.counter.textContent = `${this.currentIndex + 1} of ${this.slides.length}`;
          this.prevBtn.disabled = this.currentIndex === 0;
          this.nextBtn.disabled = this.currentIndex === this.slides.length - 1;
          this.thumbnailsPanel?.querySelectorAll(".ppt-thumbnail").forEach((t, i) => {
            t.classList.toggle("active", i === this.currentIndex);
          });
        }

        prev() { this.showSlide(this.currentIndex - 1); }
        next() { this.showSlide(this.currentIndex + 1); }

        bindEvents() {
          this.prevBtn?.addEventListener("click", () => this.prev());
          this.nextBtn?.addEventListener("click", () => this.next());
          this.thumbnailsPanel?.addEventListener("click", (e) => {
            const thumb = e.target.closest(".ppt-thumbnail");
            if (thumb) this.showSlide(parseInt(thumb.dataset.index, 10));
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") this.prev();
            if (e.key === "ArrowRight") this.next();
          });

          let startX = 0;
          this.container.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
          this.container.addEventListener("touchend", (e) => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) diff > 0 ? this.next() : this.prev();
          }, { passive: true });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const firstTitle = document
          .querySelector("#ppt-slides")
          ?.content?.querySelector(".ppt-slide")
          ?.dataset?.title;
        new PowerPointViewer("#ppt-viewer", {
          title: firstTitle || "Presentation",
          slidesTemplate: "#ppt-slides",
        });
      });
    </script>
