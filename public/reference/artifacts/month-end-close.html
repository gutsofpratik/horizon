      <script>
        /* The renderer half of the card zoom in the stylesheet above. The CSS
           carries every em-derived size; these are the hard-px ones. The test
           mirrors the media query exactly so the two cannot disagree. */
        const XL_CARD_ZOOM = window.matchMedia("(min-width: 1000px)").matches
          ? 1.6
          : 1;

        class ExcelViewer {
          constructor(container, config = {}) {
            this.container =
              typeof container === "string"
                ? document.querySelector(container)
                : container;
            this.table = this.container.querySelector(".xl-table");
            this.tabsScroll = this.container.querySelector(".xl-tabs-scroll");
            this.gridWrapper = this.container.querySelector(".xl-grid-wrapper");
            this.titleBar = this.container.querySelector(".xl-titlebar-text");
            this.nameBox = this.container.querySelector(".xl-namebox");
            this.formulaBar = this.container.querySelector(".xl-formula");
            this.selected = null; // { r, c } of the inspected cell
            this.prevTabBtn = this.container.querySelector(
              '.xl-tab-nav[data-dir="prev"]',
            );
            this.nextTabBtn = this.container.querySelector(
              '.xl-tab-nav[data-dir="next"]',
            );
            this.title = config.title || "Workbook";
            this.sheets = this.loadSheets();
            this.activeSheet = null;
            this.activeIndex = 0;
            this.colWidths = {};
            this.scaleFrame = this.container.parentElement; // .xl-scale-frame
            this.SCALED_BREAKPOINT = 400;
            this.SCALED_FACTOR = 0.9;
            // Row header width matches the tab-nav-group, snapped to whole px
            const navGroup = this.container.querySelector(".xl-tab-nav-group");
            this.ROW_HEADER_W = navGroup
              ? navGroup.offsetWidth
              : Math.round(
                  parseFloat(getComputedStyle(this.container).fontSize) * 3.5,
                );
            // Set CSS variable so th/td lock to exact same width
            this.container.style.setProperty(
              "--xl-row-header-w",
              this.ROW_HEADER_W + "px",
            );
            this.init();
          }

          /** Below the breakpoint, hold a fixed 0.9 scale and set the
            xl-app's pre-scale width/height to containerSize / 0.9 so the
            visual fills the container exactly. The internal layout stays
            responsive at all sizes. */
          updateScale() {
            if (!this.scaleFrame) return;
            const w = this.scaleFrame.clientWidth;
            const h = this.scaleFrame.clientHeight;
            if (w <= this.SCALED_BREAKPOINT) {
              this.container.style.width = w / this.SCALED_FACTOR + "px";
              this.container.style.height = h / this.SCALED_FACTOR + "px";
            } else {
              this.container.style.width = "";
              this.container.style.height = "";
            }
          }

          loadSheets() {
            const sheets = [];
            document.querySelectorAll("script[data-sheet]").forEach((el) => {
              try {
                const data = JSON.parse(el.textContent);
                sheets.push({ name: el.dataset.sheet, ...data });
              } catch (e) {
                console.warn(
                  `[ExcelViewer] Failed to parse sheet "${el.dataset.sheet}":`,
                  e,
                );
              }
            });
            return sheets;
          }

          init() {
            if (this.titleBar)
              this.titleBar.textContent = `${this.title}.xlsx - Excel`;
            document.title = this.title;
            this.renderTabs();
            if (this.sheets.length > 0) this.switchSheet(0);
            this.bindTabNav();
            this.bindCellSelect();
            this.updateScale();
            // Re-render once after layout settles for filler column calculation
            requestAnimationFrame(() => {
              if (this.activeSheet) this.renderGrid(this.activeSheet);
            });
            // Re-render on resize so filler row/column counts track the
            // available space — prevents overscroll on small viewports.
            new ResizeObserver(() => {
              if (this.activeSheet) this.renderGrid(this.activeSheet);
            }).observe(this.gridWrapper);
            // Update scale when the scale frame resizes.
            if (this.scaleFrame) {
              new ResizeObserver(() => {
                this.updateScale();
                if (this.activeSheet) this.renderGrid(this.activeSheet);
              }).observe(this.scaleFrame);
            }
          }

          colLetter(i) {
            let s = "";
            let n = i;
            while (n >= 0) {
              s = String.fromCharCode(65 + (n % 26)) + s;
              n = Math.floor(n / 26) - 1;
            }
            return s;
          }

          renderTabs() {
            this.tabsScroll.innerHTML = "";
            this.sheets.forEach((sheet, i) => {
              const btn = document.createElement("button");
              btn.className = "xl-tab";
              btn.textContent = sheet.name;
              btn.addEventListener("click", () => this.switchSheet(i));
              this.tabsScroll.appendChild(btn);
            });
          }

          switchSheet(index) {
            if (index < 0 || index >= this.sheets.length) return;
            this.activeIndex = index;
            const sheet = this.sheets[index];
            this.activeSheet = sheet;
            this.selected = null; // selection is per-sheet
            if (this.nameBox) this.nameBox.textContent = "A1";
            if (this.formulaBar) this.formulaBar.textContent = "";

            if (!this.colWidths[sheet.name]) {
              this.colWidths[sheet.name] = sheet.columns.map(
                (c) => (c.width || 100) * XL_CARD_ZOOM,
              );
            }

            this.renderGrid(sheet);

            this.tabsScroll.querySelectorAll(".xl-tab").forEach((tab, i) => {
              tab.classList.toggle("active", i === index);
            });

            // Scroll active tab into view
            const activeTab = this.tabsScroll.children[index];
            // Keep the active tab visible WITHIN the tab strip.
            //
            // Deliberately NOT scrollIntoView: that method is specified to
            // scroll EVERY ancestor scroll container. When one of these
            // artifacts is iframed into a page, the last ancestor it reaches is
            // the HOST document — and because init() calls switchSheet(0), the
            // host page scrolled itself down to the iframe on load and "opened
            // in the middle of the page" (found on horizon.com/overview-loom,
            // 2026-08-19).
            //
            // The strip only ever scrolls horizontally, so adjusting scrollLeft
            // reproduces inline:"nearest" exactly, scoped to the strip.
            //
            // Measured with getBoundingClientRect, NOT offsetLeft: the strip is
            // position:static, so the tabs' offsetParent is an ancestor of it
            // and offsetLeft overstates the in-strip offset (measured 433 vs a
            // true 370). Rect deltas are relative to the strip either way.
            if (activeTab) {
              const strip = this.tabsScroll;
              const stripBox = strip.getBoundingClientRect();
              const tabBox = activeTab.getBoundingClientRect();
              const overLeft = tabBox.left - stripBox.left;
              const overRight = tabBox.right - stripBox.right;
              if (overLeft < 0) {
                strip.scrollLeft += overLeft;
              } else if (overRight > 0) {
                strip.scrollLeft += overRight;
              }
            }

            this.updateTabNavButtons();

            this.gridWrapper.scrollTop = 0;
            this.gridWrapper.scrollLeft = 0;
          }

          updateTabNavButtons() {
            this.prevTabBtn.disabled = this.activeIndex === 0;
            this.nextTabBtn.disabled =
              this.activeIndex === this.sheets.length - 1;
          }

          bindTabNav() {
            this.prevTabBtn.addEventListener("click", () =>
              this.switchSheet(this.activeIndex - 1),
            );
            this.nextTabBtn.addEventListener("click", () =>
              this.switchSheet(this.activeIndex + 1),
            );
          }

          /* ----- Cell inspection (formula bar) ----- */
          bindCellSelect() {
            this.gridWrapper.addEventListener("click", (e) => {
              const td = e.target.closest("td");
              if (
                !td ||
                td.classList.contains("xl-row-header") ||
                td.dataset.r == null
              )
                return;
              this.selectCell(
                parseInt(td.dataset.r, 10),
                parseInt(td.dataset.c, 10),
              );
            });
          }

          cellAt(r, c) {
            const row = this.activeSheet && this.activeSheet.rows[r];
            return row ? row[c] : null;
          }

          /** Select a cell: green outline, address in the name box, and its
            "f" formula (or plain value) in the formula bar. */
          selectCell(r, c) {
            this.selected = { r, c };
            this.applySelection();
          }

          clearSelection() {
            this.selected = null;
            if (this.nameBox) this.nameBox.textContent = "A1";
            if (this.formulaBar) this.formulaBar.textContent = "";
            this.table
              .querySelectorAll("td.xl-selected")
              .forEach((el) => el.classList.remove("xl-selected"));
          }

          applySelection() {
            this.table
              .querySelectorAll("td.xl-selected")
              .forEach((el) => el.classList.remove("xl-selected"));
            if (!this.selected) return;
            const { r, c } = this.selected;
            const td = this.table.querySelector(
              `td[data-r="${r}"][data-c="${c}"]`,
            );
            if (td) td.classList.add("xl-selected");
            if (this.nameBox)
              this.nameBox.textContent = this.colLetter(c) + (r + 1);
            const cell = this.cellAt(r, c);
            let text = "";
            if (cell != null && cell !== "") {
              text =
                typeof cell === "object"
                  ? cell.f || String(cell.v ?? "")
                  : String(cell);
            }
            if (this.formulaBar) this.formulaBar.textContent = text;
          }

          renderGrid(sheet) {
            // Re-read the tab-nav-group's live offsetWidth so the row-header
            // column scales proportionally with the container's font size.
            // Otherwise ROW_HEADER_W is frozen at construction-time pixels
            // and grows visually too wide as everything else shrinks.
            const navGroup = this.container.querySelector(".xl-tab-nav-group");
            if (navGroup) {
              const navW = navGroup.offsetWidth;
              if (navW > 0 && navW !== this.ROW_HEADER_W) {
                this.ROW_HEADER_W = navW;
                this.container.style.setProperty(
                  "--xl-row-header-w",
                  navW + "px",
                );
              }
            }

            const widths = this.colWidths[sheet.name];
            const numCols = sheet.columns.length;

            // Calculate filler columns to fill visible width
            const wrapperW = this.gridWrapper.clientWidth || 800;
            const wrapperH = this.gridWrapper.clientHeight || 600;
            const usedW = this.ROW_HEADER_W + widths.reduce((a, b) => a + b, 0);
            const defaultColW = 80 * XL_CARD_ZOOM;
            const extraCols =
              usedW < wrapperW
                ? Math.ceil((wrapperW - usedW) / defaultColW)
                : 0;
            const totalCols = numCols + extraCols;

            const contentRows = sheet.rows.length;

            // Colgroup + thead + tbody builder (rowCount rows in the body).
            const buildHTML = (rowCount) => {
              let out = `<colgroup><col style="width:${this.ROW_HEADER_W}px">`;
              widths.forEach((w) => {
                out += `<col style="width:${w}px">`;
              });
              for (let i = 0; i < extraCols; i++)
                out += `<col style="width:${defaultColW}px">`;
              out += `</colgroup>`;
              out += "<thead><tr>";
              out += '<th class="xl-corner"></th>';
              for (let ci = 0; ci < totalCols; ci++)
                out += `<th>${this.colLetter(ci)}</th>`;
              out += "</tr></thead>";
              out += "<tbody>";
              for (let ri = 0; ri < rowCount; ri++) {
                out += "<tr>";
                out += `<td class="xl-row-header">${ri + 1}</td>`;
                const row = sheet.rows[ri] || [];
                for (let ci = 0; ci < totalCols; ci++) {
                  const cell = ci < numCols ? row[ci] : null;
                  const addr = ` data-r="${ri}" data-c="${ci}"`;
                  if (cell == null || cell === "") {
                    out += `<td${addr}></td>`;
                  } else if (typeof cell === "object") {
                    const cls = cell.cls ? ` class="${cell.cls}"` : "";
                    const sty = cell.style ? ` style="${cell.style}"` : "";
                    const cs =
                      cell.colspan && cell.colspan > 1
                        ? ` colspan="${cell.colspan}"`
                        : "";
                    out += `<td${addr}${cls}${sty}${cs}>${cell.v ?? ""}</td>`;
                    if (cell.colspan && cell.colspan > 1) {
                      ci += cell.colspan - 1;
                    }
                  } else {
                    out += `<td${addr}>${cell}</td>`;
                  }
                }
                out += "</tr>";
              }
              out += "</tbody>";
              return out;
            };

            // Pass 1: render a probe with min-height stretch disabled so
            // we measure natural row height (not stretched by min-height:100%).
            this.table.style.minHeight = "0";
            const probeCount = Math.max(contentRows, 1);
            this.table.innerHTML = buildHTML(probeCount);
            const firstRow = this.table.querySelector("tbody tr");
            const headerRow = this.table.querySelector("thead tr");
            // A zero-height measurement is the danger case, not a
            // missing one — so `? :` on the element is not enough. While
            // the day-card hosting this artifact is being dealt, the panel
            // has no layout, the ResizeObserver still fires, and every
            // measurement below reads 0. Dividing by that gives Infinity,
            // and buildHTML() then concatenates <tr>s until V8 refuses the
            // string: ~6.5s of frozen page ending in "RangeError: Invalid
            // string length" (Skylar 8/31, "page freeze when I click on
            // these roles"). Guard the DIVISOR the way wrapperW above is
            // guarded with `|| 800`.
            // Probe: qa-ov4-artifact-grid-collapse.mjs.
            const measuredRowH = firstRow ? firstRow.getBoundingClientRect().height : 0;
            const rowH = measuredRowH > 0 ? measuredRowH : 28;
            const measuredHeaderH = headerRow ? headerRow.getBoundingClientRect().height : 0;
            const headerH = measuredHeaderH > 0 ? measuredHeaderH : 28;
            this.table.style.minHeight = ""; // restore CSS min-height:100%

            // How many natural-height rows fit. Floor leaves up to one
            // row's worth of remainder; that remainder is absorbed by the
            // table's min-height:100% which stretches rows slightly to
            // fill — never by more than one row divided across N.
            // Cap as defense in depth: a guarded divisor fixes today's
            // zero, the cap means no future zero-measure path can be
            // unbounded.
            const MAX_FILLER_ROWS = 200;
            const visibleCapacity = Math.max(
              1,
              Math.min(MAX_FILLER_ROWS, Math.floor((wrapperH - headerH) / rowH)),
            );

            // Fill the viewport — content rows always render, then filler
            // rows up to capacity. On resize down, filler rows drop off
            // one by one, so no scrollbar appears from empty rows.
            const rowCount = Math.max(contentRows, visibleCapacity);

            // Pass 2: render final row count.
            this.table.innerHTML = buildHTML(rowCount);
            // Re-apply the inspected cell after any re-render (resize,
            // filler recalculation) so the selection survives.
            this.applySelection();
          }
        }

        document.addEventListener("DOMContentLoaded", () => {
          new ExcelViewer("#xl-viewer", {
            title: "Month-end close — July 2026",
          });
        });
      </script>
    </div>
  </body>
</html>
