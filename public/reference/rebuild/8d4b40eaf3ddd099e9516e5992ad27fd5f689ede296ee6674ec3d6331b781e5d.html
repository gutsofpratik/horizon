<!doctype html>
<html lang="en">
  <head><base href="https://assets.claude.ai/brand/artifacts/product/overview/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Action items — running list</title>
    <!-- Slack body type: Lato when installed, otherwise the system stack.
         Fully self-contained: no external font (or any other) requests. -->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          "Lato",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.5;
        /* Default: clip overflow. The frame below switches to scroll
           when the scaled-mode container query kicks in. */
        overflow: hidden;
      }

      /* ----- Scale frame -----
         Acts as the scroll container when the artifact renders at a fixed
         natural size and is scaled down. A container query lets the scaled
         mode kick in based on the parent's width, not the viewport. */
      .slack-scale-frame {
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: inline-size;
      }

      /* ----- Slack chrome ----- */
      .slack-app {
        background: #ffffff;
        overflow: hidden;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        font-size: 14px;
        transform-origin: top left;
        color: #1d1c1d;
      }

      /* ----- Scaled mode: <= 400px container width -----
         Scale stays fixed at 0.9 so the chrome always renders at "desktop"
         sizes. The slack-app's pre-scale width/height are set by JS to
         containerSize / 0.9 — so the visual fills the container exactly,
         and the internal layout (search bar, compose, message content,
         etc.) adapts to the available width the same way it does above
         400px. Nothing scales down further; the layout reflows like normal. */
      @container (max-width: 400px) {
        .slack-scale-frame {
          overflow: hidden;
        }
        .slack-app {
          /* width + height set by JS — see updateScale() */
          transform: scale(0.9);
        }
      }

      /* ---- Top titlebar (matches other templates' titlebar height) ---- */
      .slack-titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.45em 1em;
        background: #2b0928;
        gap: 0.8em;
        flex-shrink: 0;
        min-height: 0;
      }
      .slack-traffic-lights {
        display: flex;
        gap: 0.45em;
        flex: 0 0 auto;
        width: 5em;
      }
      .slack-traffic-light {
        width: 0.85em;
        height: 0.85em;
        border-radius: 50%;
      }
      .slack-traffic-light.red {
        background: #ff5f57;
      }
      .slack-traffic-light.yellow {
        background: #febc2e;
      }
      .slack-traffic-light.green {
        background: #28c840;
      }

      .slack-titlebar-search {
        flex: 1 1 auto;
        /* Caps at 240px and shrinks below that when the titlebar runs
           out of room (flex: 1 1 auto + min-width 0 lets it compress). */
        max-width: 240px;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.55em;
        background: #533553;
        color: rgba(255, 255, 255, 0.6);
        border-radius: 5px;
        padding: 0.3em 0.6em;
        font-size: 0.92em;
        font-weight: 400;
      }
      .slack-titlebar-search svg {
        width: 1em;
        height: 1em;
        flex-shrink: 0;
      }
      .slack-titlebar-search-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .slack-titlebar-end {
        flex: 0 0 auto;
        width: 5em;
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }
      .slack-titlebar-avatar {
        width: 1.6em;
        height: 1.6em;
        border-radius: 5px;
        overflow: hidden;
        line-height: 0;
      }
      .slack-titlebar-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---- Chat region (titlebar below this) ----
         Channel header + tabs are absolutely positioned over the top of
         the messages area, and the compose area is absolutely positioned
         over the bottom — so messages can scroll BEHIND both. JS measures
         the heights of those overlays and pads the messages content
         accordingly so nothing is hidden initially. */
      .slack-chat {
        flex: 1 1 auto;
        position: relative;
        overflow: hidden;
        min-height: 0;
        background: white;
      }

      /* ---- Top overlay: channel header + tabs ---- */
      .slack-chat-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        background: white;
      }
      .slack-channel-header {
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.45em 1em 0.45em 1.1em;
        /* No border or shadow below — content scrolls cleanly behind. */
      }
      .slack-channel-user {
        display: flex;
        align-items: center;
        gap: 0.55em;
        padding: 0.2em 0.55em 0.2em 0.2em;
        border-radius: 6px;
      }
      .slack-channel-user:hover {
        background: rgba(29, 28, 29, 0.04);
      }
      .slack-channel-avatar {
        width: 1.7em;
        height: 1.7em;
        border-radius: 4px;
        /* No overflow:hidden — the status dot lives outside the bounds.
           The avatar SVG provides its own rounded corners via <rect rx>. */
        position: relative;
        flex-shrink: 0;
        line-height: 0;
      }
      .slack-channel-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .slack-channel-avatar::after {
        /* Online status dot */
        content: "";
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: #2bac76;
        box-shadow: 0 0 0 2px white;
      }
      .slack-channel-name {
        display: flex;
        align-items: center;
        gap: 0.05em;
        font-family: "Lato", sans-serif;
        font-weight: 900;
        font-size: 1.28em;
        line-height: 1.33;
        color: #1d1c1d;
      }
      .slack-channel-name svg {
        width: 1.1em;
        height: 1.1em;
      }
      .slack-channel-actions {
        display: flex;
        align-items: center;
        gap: 0.15em;
      }
      .slack-channel-action {
        padding: 0.3em;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slack-channel-action:hover {
        background: rgba(29, 28, 29, 0.06);
      }
      .slack-channel-action svg {
        width: 1.3em;
        height: 1.3em;
      }

      .slack-tabs {
        background: white;
        padding: 0 1.5em;
        border-bottom: 1px solid #f0eee6;
      }
      .slack-tab {
        display: inline-block;
        padding: 0.65em 0.6em;
        font-family: "Lato", sans-serif;
        font-weight: 700;
        font-size: 0.93em;
        color: #1d1c1d;
        position: relative;
      }
      .slack-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: #007a5a;
      }

      /* ---- Messages scroll area (fills entire chat region) ---- */
      .slack-messages-scroll {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: #c0c0c0 transparent;
        z-index: 1;
      }
      .slack-messages-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .slack-messages-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .slack-messages-scroll::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border-radius: 3px;
      }

      .slack-messages-content {
        padding: 0 1.6em;
        /* JS sets padding-top (chat-top height + 16px gap) and padding-bottom
           (compose height + breathing room). With top-anchored flow, the
           first message sits exactly 16px below the tabs, and overflow
           scrolls — content passing behind both the chat-top (covered by
           white) and the compose card. */
      }
      .slack-messages {
        display: flex;
        flex-direction: column;
        gap: 1em;
      }

      .slack-message {
        display: flex;
        gap: 0.6em;
        align-items: flex-start;
      }
      .slack-message-avatar {
        width: 2.6em;
        height: 2.6em;
        border-radius: 5px;
        flex-shrink: 0;
        margin-top: 0.2em;
        overflow: hidden;
        line-height: 0;
      }
      .slack-message-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .slack-message-body {
        flex: 1;
        min-width: 0;
        padding: 0 0.55em;
      }
      .slack-message-meta {
        display: flex;
        align-items: baseline;
        gap: 0.6em;
        margin-bottom: 0.05em;
      }
      .slack-message-author {
        font-family: "Lato", sans-serif;
        font-weight: 900;
        font-size: 1.07em;
        color: #1d1c1d;
        line-height: 1.4;
      }
      .slack-message-time {
        font-size: 0.86em;
        color: #616061;
        line-height: 1.4;
      }
      .slack-message-content {
        color: #1d1c1d;
        font-family: "Lato", sans-serif;
        font-weight: 500;
        font-size: 0.93em;
        line-height: 1.4;
      }
      .slack-message-content p {
        margin-bottom: 0.55em;
      }
      .slack-message-content p:last-child {
        margin-bottom: 0;
      }
      .slack-message-content em {
        font-style: italic;
      }
      .slack-message-content strong {
        font-weight: 700;
      }
      .slack-message-content ol,
      .slack-message-content ul {
        margin: 0.35em 0 0.45em 1.4em;
      }
      .slack-message-content li {
        margin-bottom: 0.4em;
      }
      .slack-message-content li:last-child {
        margin-bottom: 0;
      }
      .slack-message-content a {
        color: #1264a3;
        text-decoration: underline;
      }
      .slack-message-content code {
        font-family: "Consolas", "Monaco", monospace;
        background: #f6f6f6;
        border: 1px solid #dadada;
        padding: 0.05em 0.4em;
        border-radius: 3px;
        font-size: 0.92em;
        color: #b02b46;
      }
      /* Inline data tables */
      .slack-message-content .slack-table-wrap {
        /* Default: fully-bordered, rounded card — the right edge is visible. */
        margin: 0.6em 0;
        border: 1px solid #e0ddd6;
        border-radius: 8px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      /* When the table is wider than the thread it side-scrolls and bleeds off
         whichever edge has more content beyond it, so it reads as running off
         rather than closing in a card. JS toggles `.bleed-left` / `.bleed-right`
         based on scroll position: the right bleeds until you scroll to the end,
         the left bleeds once you scroll away from the start. */
      .slack-message-content .slack-table-wrap.bleed-right {
        border-right: none;
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }
      .slack-message-content .slack-table-wrap.bleed-left {
        border-left: none;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .slack-message-content table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9em;
        line-height: 1.35;
      }
      .slack-message-content th,
      .slack-message-content td {
        padding: 6px 13px;
        text-align: left;
        border-right: 1px solid #ededeb;
        border-bottom: 1px solid #ededeb;
        white-space: nowrap;
      }
      .slack-message-content th {
        font-weight: 700;
      }
      .slack-message-content th.num,
      .slack-message-content td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .slack-message-content tr th:last-child,
      .slack-message-content tr td:last-child {
        border-right: none;
      }
      .slack-message-content th:first-child,
      .slack-message-content td:first-child {
        padding-left: 9px;
      }
      .slack-message-content tbody tr:last-child td {
        border-bottom: none;
      }

      /* Caption line below a Claude message (timestamp / context note) */
      .slack-message-content .slack-caption {
        font-size: 12px;
        font-style: italic;
        color: #616061;
        margin-top: 6px;
      }

      /* "Open session in Claude" deep-link */
      .slack-message-content .slack-open-session {
        display: inline-block;
        margin-top: 8px;
        font-size: 12px;
        color: #1264a3;
        text-decoration: none;
      }
      .slack-message-content .slack-open-session:hover {
        text-decoration: underline;
      }

      /* App/bot badge after the author name (AGENT for Claude, APP for third parties) */
      .slack-agent-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1px 3px;
        background: rgba(29, 28, 29, 0.13);
        border-radius: 2px;
        font-size: 10px;
        font-weight: 600;
        color: rgba(29, 28, 29, 0.7);
        line-height: 12px;
        margin-left: 4px;
        vertical-align: middle;
      }

      /* Task / work-item checklist inside a Claude message */
      .slack-message-content .slack-tasks {
        margin: 0.5em 0 0.15em;
      }
      .slack-message-content .slack-task {
        display: flex;
        gap: 0.55em;
        align-items: flex-start;
        margin-bottom: 0.34em;
      }
      .slack-message-content .slack-task:last-child {
        margin-bottom: 0;
      }
      .slack-message-content .slack-task .mk {
        flex-shrink: 0;
        color: #1d1c1d;
        font-weight: 700;
        line-height: 1.4;
        width: 1em;
        text-align: center;
      }
      /* .running state: task still in progress (use ✱ as the mark) */
      .slack-message-content .slack-task.running .mk {
        color: #1d1c1d;
      }

      /* Image / file attachment (e.g. an exported chart) */
      .slack-message-content .slack-attachment {
        margin: 0.6em 0;
        max-width: 360px;
      }
      .slack-message-content .slack-attachment-name {
        font-size: 0.92em;
        color: #1d1c1d;
        margin-bottom: 0.3em;
      }
      .slack-message-content .slack-attachment-name .caret {
        color: #616061;
        margin-left: 0.2em;
      }
      .slack-message-content .slack-attachment img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #e0ddd6;
        border-radius: 8px;
      }

      /* ---- Compose overlay (bottom) ---- */
      .slack-compose-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 3;
        background: white;
        padding: 0 1.6em 1.4em;
      }
      .slack-compose-card {
        background: white;
        border: 1px solid rgba(29, 28, 29, 0.13);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .slack-compose-toolbar {
        background: #f8f8f8;
        padding: 0.3em 0.4em;
        display: flex;
        align-items: center;
        gap: 0.3em;
      }
      .slack-toolbar-btn {
        padding: 0.35em;
        border-radius: 4px;
        opacity: 0.3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slack-toolbar-btn svg {
        width: 1.15em;
        height: 1.15em;
      }
      .slack-toolbar-divider {
        width: 1px;
        height: 1.3em;
        background: rgba(29, 28, 29, 0.13);
        margin: 0 0.2em;
      }

      .slack-compose-input {
        padding: 0.6em 0.85em;
        font-family: "Lato", sans-serif;
        font-size: 1em;
        color: rgba(29, 28, 29, 0.5);
        line-height: 1.47;
      }

      .slack-compose-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0.3em 0.2em 0.4em;
      }
      .slack-compose-bottom-left {
        display: flex;
        align-items: center;
        gap: 0.15em;
      }
      .slack-bottom-btn {
        padding: 0.35em;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slack-bottom-btn svg {
        width: 1.15em;
        height: 1.15em;
      }
      .slack-bottom-btn.attach {
        background: rgba(29, 28, 29, 0.06);
        border-radius: 50%;
        width: 1.65em;
        height: 1.65em;
        padding: 0;
      }
      .slack-bottom-btn.attach svg {
        width: 1em;
        height: 1em;
      }
      .slack-bottom-divider {
        width: 1px;
        height: 1.3em;
        background: rgba(29, 28, 29, 0.13);
        margin: 0 0.3em;
      }
      .slack-send {
        display: flex;
        align-items: stretch;
        height: 1.85em;
      }
      .slack-send-main,
      .slack-send-more {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.55em;
      }
      .slack-send-main {
        border-radius: 4px 0 0 4px;
      }
      .slack-send-more {
        border-radius: 0 4px 4px 0;
        padding: 0 0.3em;
        position: relative;
      }
      .slack-send-more::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.3em;
        bottom: 0.3em;
        width: 1px;
        background: rgba(29, 28, 29, 0.06);
      }
      .slack-send svg {
        width: 1.05em;
        height: 1.05em;
      }

      /* Hash glyph before the channel name in the header */
      .slack-channel-hash {
        margin-right: 0.12em;
        font-weight: 900;
      }

      /* ---- Running action-item list card (visual language from the
              readout card in the sibling Slack facsimile, rendered as a
              card inside Claude's Slack message) ---- */
      .slack-message-content .al {
        --al-ink: #1a1a1a;
        --al-soft: #6b6b6b;
        --al-label: #8c8c8c;
        --al-line: #e6e6e6;
        --al-grid: #f0f0f0;
        --al-done: #2e7d51;
        --al-remind-bg: #fdf3dd;
        --al-remind-line: #f0e0b4;
        --al-remind-ink: #8a6d1f;
        margin: 0.7em 0;
        border: 1px solid #e0ddd6;
        border-radius: 8px;
        background: #fff;
        padding: 14px 16px 12px;
        max-width: 680px;
        color: var(--al-ink);
      }
      .al-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .al-title {
        font-family:
          "Tiempos Text", "Tiempos Headline", Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .al-sub {
        font-size: 12px;
        color: var(--al-soft);
        margin-top: 2px;
      }
      .al-updated {
        font-size: 12px;
        font-style: italic;
        color: var(--al-label);
        padding-top: 3px;
        white-space: nowrap;
      }
      /* The count strip — the list's arithmetic, always visible. */
      .al-count {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: wrap;
        border: 1px solid var(--al-line);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 4px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .al-count strong {
        font-weight: 700;
      }
      .al-count .dot {
        color: var(--al-label);
      }
      .al-count-next {
        margin-left: auto;
        font-size: 12px;
        color: var(--al-soft);
        white-space: nowrap;
      }
      .al-group {
        margin-top: 10px;
      }
      .al-group-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--al-label);
        margin-bottom: 2px;
      }
      .al-item {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 6px 0;
        border-bottom: 1px solid var(--al-grid);
        font-size: 13px;
        line-height: 1.45;
      }
      .al-group:last-of-type .al-item:last-child {
        border-bottom: none;
      }
      /* Checkbox: the ✓ glyph is always in the markup and rides the text
         color — transparent while open, white on green once done. */
      .al-check {
        flex-shrink: 0;
        width: 15px;
        height: 15px;
        margin-top: 2px;
        border: 1.5px solid #b9b6ad;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: transparent;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1;
      }
      .al-item.done .al-check {
        background: var(--al-done);
        border-color: var(--al-done);
        color: #fff;
      }
      .al-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .al-item.done .al-text {
        color: var(--al-soft);
        text-decoration: line-through;
        text-decoration-color: rgba(29, 28, 29, 0.35);
      }
      .al-meta {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 46%;
      }
      .al-owner {
        font-weight: 700;
        font-size: 12px;
        color: var(--al-ink);
      }
      .al-status {
        display: inline-block;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.8;
        white-space: nowrap;
      }
      .al-status.open {
        color: var(--al-soft);
        border: 1px solid var(--al-line);
        background: #fafaf8;
      }
      .al-status.done {
        color: var(--al-done);
        border: 1px solid #cfe5d8;
        background: #f1f8f4;
      }
      /* Reminder chip on an open item — queued/sent affordance. */
      .al-remind {
        display: inline-block;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--al-remind-bg);
        border: 1px solid var(--al-remind-line);
        color: var(--al-remind-ink);
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.8;
        white-space: nowrap;
      }
      .al-notes {
        border: 1px solid var(--al-remind-line);
        background: var(--al-remind-bg);
        border-radius: 10px;
        padding: 10px 12px 9px;
        margin: 12px 0 10px;
        font-size: 12px;
        line-height: 1.45;
      }
      .al-notes .al-group-label {
        color: var(--al-remind-ink);
        margin-bottom: 4px;
      }
      .al-foot {
        font-size: 12px;
        color: var(--al-label);
        padding-top: 2px;
      }
    

      /* ----- Card zoom (Skylar 2026-09-03: "content of excel sheet
         too small to read", extended to every facsimile family) -----
         Card surfaces pin this document to its authoring box and
         transform-scale the whole iframe into a far smaller window — the
         library rails at ~0.44, the modal artifact well at 0.6, the card
         face at 0.61 — so this chrome's em-derived text was landing at
         4-6px. Authoring the document zoomed puts the surface's shrink on
         legible type instead. Here every size in the window is em-derived from that one rule.
         Gated on the LAYOUT width so the roles band's ~608px artifact
         mount and the phone embed page stay 1x. */
      @media (min-width: 1000px) {
        .slack-app {
          font-size: calc(14px * 1.6);
        }
      }
</style>

      <script>
        class SlackViewer {
          constructor(container, config = {}) {
            this.container =
              typeof container === "string"
                ? document.querySelector(container)
                : container;
            this.title = config.title || "Slack";

            const source = document.querySelector(
              config.messagesTemplate || "#slack-messages",
            );
            this.authoredMessages = source
              ? Array.from(source.content.querySelectorAll(".slack-message"))
              : [];

            this.scaleFrame = this.container.parentElement; // .slack-scale-frame
            this.chatTop = this.container.querySelector(".slack-chat-top");
            this.composeArea = this.container.querySelector(
              ".slack-compose-area",
            );
            this.messagesContent = this.container.querySelector(
              ".slack-messages-content",
            );
            this.messagesList = this.container.querySelector(".slack-messages");
            this.scroll = this.container.querySelector(
              ".slack-messages-scroll",
            );

            this.channelNameEl = this.container.querySelector(
              "[data-channel-name]",
            );
            this.channelAvatarEl = this.container.querySelector(
              "[data-channel-avatar]",
            );
            this.titlebarAvatarEl = this.container.querySelector(
              "[data-titlebar-avatar]",
            );

            this.GAP_BELOW_TABS = 24; // px (kept constant so it scales with transform)
            this.GAP_ABOVE_COMPOSE = 8; // px breathing room
            this.SCALED_BREAKPOINT = 400;
            this.SCALED_FACTOR = 0.9;

            this.init();
          }

          init() {
            document.title = this.title;
            this.applyChannelFromFirstMessage();
            this.renderMessages();
            this.updateScale();
            this.updatePadding();
            this.updateTableOverflow();
            this.scrollToLatest();
            const ro = new ResizeObserver(() => {
              this.updateScale();
              this.updatePadding();
              this.updateTableOverflow();
              if (this.pinnedToLatest) this.scrollToLatest();
            });
            if (this.chatTop) ro.observe(this.chatTop);
            if (this.composeArea) ro.observe(this.composeArea);
            if (this.container) ro.observe(this.container);
            if (this.scaleFrame) ro.observe(this.scaleFrame);
          }

          /* A channel opens at its newest message — here that is the
             correction thread, which is the artifact's whole point — and
             stays pinned there while the embedding iframe is still finding
             its size. A hand scroll (wheel/touch, not the ResizeObserver's
             own scrolling) unpins it. */
          scrollToLatest() {
            if (!this.scroll) return;
            this.pinnedToLatest = true;
            this.scroll.scrollTop = this.scroll.scrollHeight;
            if (!this.unpinBound) {
              this.unpinBound = true;
              const unpin = () => (this.pinnedToLatest = false);
              this.scroll.addEventListener("wheel", unpin, { passive: true });
              this.scroll.addEventListener("touchstart", unpin, {
                passive: true,
              });
            }
          }

          /** Below the breakpoint, the slack-app holds a fixed 0.8 scale
            and we set its pre-scale width/height to containerSize / 0.8 so
            the visual fills the container. The internal layout flows at
            the pre-scale width — so chrome elements (search bar, etc.) are
            responsive the same way they are above the breakpoint. */
          updateScale() {
            if (!this.scaleFrame) return;
            const w = this.scaleFrame.clientWidth;
            const h = this.scaleFrame.clientHeight;
            if (w <= this.SCALED_BREAKPOINT) {
              this.container.style.width = w / this.SCALED_FACTOR + "px";
              this.container.style.height = h / this.SCALED_FACTOR + "px";
            } else {
              this.container.style.width = "";
              this.container.style.height = "";
            }
          }

          /** First message can override channel header + titlebar avatar. */
          applyChannelFromFirstMessage() {
            const first = this.authoredMessages[0];
            if (!first) return;
            const ds = first.dataset;
            if (ds.channelName && this.channelNameEl) {
              this.channelNameEl.textContent = ds.channelName;
            }
            const channelAvatar = ds.channelAvatar || ds.avatar;
            if (channelAvatar) {
              const ref = "#" + channelAvatar;
              this.channelAvatarEl
                ?.querySelector("use")
                ?.setAttribute("href", ref);
              this.titlebarAvatarEl
                ?.querySelector("use")
                ?.setAttribute("href", ref);
            }
          }

          renderMessages() {
            if (!this.messagesList) return;
            this.messagesList.innerHTML = "";
            this.authoredMessages.forEach((authored) => {
              const ds = authored.dataset;
              const wrap = document.createElement("div");
              wrap.className = "slack-message";

              const avatar = document.createElement("div");
              avatar.className = "slack-message-avatar";
              const avatarId = ds.avatar || "avatar-claude";
              avatar.innerHTML = `<svg viewBox="0 0 32 32"><use href="#${avatarId}"/></svg>`;
              wrap.appendChild(avatar);

              const body = document.createElement("div");
              body.className = "slack-message-body";

              const meta = document.createElement("div");
              meta.className = "slack-message-meta";
              const author = document.createElement("span");
              author.className = "slack-message-author";
              author.textContent = ds.author || "Unknown";
              if (ds.badge || ds.isAgent === "true") {
                const badge = document.createElement("span");
                badge.className = "slack-agent-badge";
                badge.textContent = ds.badge || "AGENT";
                author.appendChild(badge);
              }
              const time = document.createElement("span");
              time.className = "slack-message-time";
              time.textContent = ds.time || "";
              meta.appendChild(author);
              meta.appendChild(time);
              body.appendChild(meta);

              const content = document.createElement("div");
              content.className = "slack-message-content";
              content.innerHTML = authored.innerHTML;
              body.appendChild(content);

              wrap.appendChild(body);
              this.messagesList.appendChild(wrap);
            });
          }

          /** Edge-aware bleed for inline table wraps. When a table overflows it
            side-scrolls and bleeds off whichever edge has more content past it:
            the right edge bleeds until you reach the end, the left edge bleeds
            once you scroll away from the start. A table that fits keeps its
            full border on all sides. Re-runs on resize; also binds a one-time
            scroll listener per wrap so it updates as the user scrolls. */
          updateTableOverflow() {
            const root = this.container || document;
            root.querySelectorAll(".slack-table-wrap").forEach((wrap) => {
              this.updateTableEdges(wrap);
              if (!wrap.dataset.bleedBound) {
                wrap.dataset.bleedBound = "1";
                wrap.addEventListener(
                  "scroll",
                  () => this.updateTableEdges(wrap),
                  { passive: true },
                );
              }
            });
          }

          updateTableEdges(wrap) {
            const overflowing = wrap.scrollWidth > wrap.clientWidth + 1;
            const atStart = wrap.scrollLeft <= 0;
            const atEnd =
              wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;
            wrap.classList.toggle("bleed-right", overflowing && !atEnd);
            wrap.classList.toggle("bleed-left", overflowing && !atStart);
          }

          /** Pad the messages content so the first message starts 16px below
            the tabs and the last message isn't hidden behind the compose
            area. Re-runs on resize. */
          updatePadding() {
            if (!this.messagesContent) return;
            const topH = this.chatTop ? this.chatTop.offsetHeight : 0;
            const bottomH = this.composeArea
              ? this.composeArea.offsetHeight
              : 0;
            this.messagesContent.style.paddingTop =
              topH + this.GAP_BELOW_TABS + "px";
            this.messagesContent.style.paddingBottom =
              bottomH + this.GAP_ABOVE_COMPOSE + "px";
          }
        }

        document.addEventListener("DOMContentLoaded", () => {
          new SlackViewer("#slack-viewer", {
            title: "Action items — running list",
            messagesTemplate: "#slack-messages",
          });
        });
      </script>
    </div>
  </body>
</html>
